[package]
name = "linux-digital-detective"
version = "0.1.0"
edition = "2021"
description = "A local-first Linux incident investigation and evidence-correlation tool"
license = "MIT"
repository = "https://github.com/SachuJames/linux-digital-detective"
readme = "README.md"
rust-version = "1.80"
keywords = ["forensics", "incident-response", "linux", "observability", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "lddetective"
path = "src/main.rs"

[lib]
name = "lddetective_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1"
thiserror = "2"
toml = { version = "0.8", features = ["parse"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
